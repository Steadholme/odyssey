<!doctype html><html lang="en" data-ody-design="line" data-expression="line" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standalone data tools · Odyssey</title><link rel="stylesheet" href="/1.5.0/odyssey-font.css"><link rel="stylesheet" href="/1.5.0/odyssey-line-font.css"><link rel="stylesheet" href="/1.5.0/odyssey-line.css"><link rel="stylesheet" href="/1.5.0/data-tools.css"><script src="/1.5.0/odyssey.js" defer></script><script src="/1.5.0/data-tools.js" defer></script></head><body><main style="max-width:760px;margin:auto;padding:24px;font-family:var(--ody-font,system-ui);color:var(--ody-ink)"><h1>Release notes</h1><p>This consumer uses public assets and its own data. No private page script.</p><section aria-labelledby="text-title"><h2 id="text-title">Source text</h2><div id="standalone-text"></div></section><section aria-labelledby="list-title"><h2 id="list-title">Archive</h2><div id="standalone-list"></div></section><section aria-labelledby="plot-title"><h2 id="plot-title">Impact</h2><div id="standalone-plot"></div></section><p><a href="/data-tools.html">All data tools</a></p><noscript><p>The release note is: Line remains the primary expression. The archive and chart use optional JavaScript.</p></noscript></main><script>document.addEventListener('DOMContentLoaded',function(){OdysseyDataTools.mountText(document.getElementById('standalone-text'),{text:'Line remains the primary expression.\nProduction scope: Odyssey.',label:'Release note'});OdysseyDataTools.mountVirtualList(document.getElementById('standalone-list'),{items:Array.from({length:10000},function(_,i){return{id:'item-'+i,label:'Archive record '+(i+1)};}),label:'Release archive'});OdysseyDataTools.mountPlot(document.getElementById('standalone-plot'),{name:'Net impact',xType:'number',xUnit:'day',yUnit:'points',series:[{id:'net',name:'Net',values:[{x:1,y:4},{x:2,y:null},{x:3,y:-2},{x:4,y:8}]}]});});</script></body></html>
