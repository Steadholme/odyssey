name: Verify Odyssey release candidate
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - name: Install the Rust linker and Git
        run: apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev git
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/browser-runtime/package-lock.json
      - run: npm ci --prefix tools/browser-runtime
      # The accepted Linux PNGs and browsers come from this exact Playwright image.
      - name: Prepare the explicit pre-freeze candidate when needed
        run: |
          if [ ! -d releases/1.5.0 ]; then
            ./tools/build-public-dist.sh --output "$RUNNER_TEMP/odyssey-1.5.0-candidate"
            echo "ODYSSEY_PUBLIC_RELEASE_DIR=$RUNNER_TEMP/odyssey-1.5.0-candidate" >> "$GITHUB_ENV"
          fi
      - run: ./tools/verify.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-differences
          path: /tmp/odyssey-visual-results
          if-no-files-found: ignore
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.87.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --manifest-path tools/odysseyctl/Cargo.toml
      - name: Check the server against the declared minimum Rust version
        run: |
          if [ ! -d releases/1.5.0 ]; then
            ./tools/build-public-dist.sh --output "$RUNNER_TEMP/odyssey-1.5.0-msrv"
            export ODYSSEY_PUBLIC_RELEASE_DIR="$RUNNER_TEMP/odyssey-1.5.0-msrv"
          fi
          cargo check --locked --manifest-path server/Cargo.toml
